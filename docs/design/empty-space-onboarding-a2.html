<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tablign — A안 간격·밀도 변형</title>
<style>
  :root{
    --accent:#3b5bdb; --accent-weak:#edf0fe; --ink:#1f2430; --muted:#868e96;
    --faint:#adb5bd; --border:#eaecef; --bg:#fcfcfd; --surface:#fff;
    --surface2:#f1f3f5; --lavender:#c9d4ff;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#eef0f4; color:var(--ink); padding:28px 20px 60px;
  }
  h1{font-size:16px; font-weight:740; letter-spacing:-.02em; margin-bottom:4px}
  .note{font-size:12.5px; color:var(--muted); margin-bottom:18px}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .tabs button{
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    padding:7px 13px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .tabs button[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .replay{
    margin-left:auto; border:1px solid var(--border); background:var(--surface); color:var(--accent);
    padding:7px 13px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:700;
  }
  .variant{display:none}
  .variant.on{display:block}
  .caption{font-size:12.5px; color:var(--muted); margin:10px 2px 0; line-height:1.6}
  .caption b{color:var(--ink)}

  .frame{
    max-width:960px; background:var(--bg); border:1px solid var(--border);
    border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(20,30,60,.08);
    display:flex; min-height:480px;
  }
  .side{
    width:168px; border-right:1px solid var(--border); background:var(--surface);
    padding:14px 12px; flex:none; display:flex; flex-direction:column; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:7px; font-weight:740; letter-spacing:-.03em; font-size:14px}
  .brand .lign{color:var(--accent)}
  .side .label{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.06em; margin-top:8px}
  .side .ghostrow{height:26px; border-radius:7px; background:var(--surface2); opacity:.55}
  .board{flex:1; padding:26px 30px; display:flex; align-items:center; justify-content:center}
  .center{text-align:center; max-width:400px}

  /* ── 파라미터화된 벤토: --bs 전체, --big 큰칸, --small 작은칸, --g 간격 ── */
  .bento{width:var(--bs); height:var(--bs); margin:0 auto; position:relative}
  .cell{position:absolute; border-radius:var(--r1); opacity:0;
    animation:drop .5s cubic-bezier(.2,.9,.3,1.2) forwards}
  .c1{left:0; top:0; width:var(--big); height:var(--big); background:var(--accent); animation-delay:.1s}
  .c2{right:0; top:0; width:var(--small); height:var(--small); background:var(--ink); border-radius:var(--r2); animation-delay:.28s}
  .c3{right:0; top:calc(var(--small) + var(--g)); width:var(--small);
      height:calc(var(--bs) - var(--small) - var(--g)); background:var(--lavender); border-radius:var(--r2); animation-delay:.42s}
  .c4{left:0; bottom:0; width:var(--big);
      height:calc(var(--bs) - var(--big) - var(--g)); background:var(--lavender); border-radius:var(--r2); animation-delay:.56s}
  .chip{position:absolute; left:12%; height:15%; border-radius:4px; background:rgba(255,255,255,.92);
    opacity:0; animation:slotIn .35s ease forwards}
  .chip:nth-child(1){top:13%; width:62%; animation-delay:.9s}
  .chip:nth-child(2){top:36%; width:48%; animation-delay:1.05s}
  .chip:nth-child(3){top:59%; width:70%; animation-delay:1.2s}
  @keyframes drop{from{opacity:0; transform:translateY(-14px) scale(.92)} to{opacity:1; transform:none}}
  @keyframes slotIn{from{opacity:0; transform:translateX(-8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){.cell,.chip{animation:none; opacity:1; transform:none}}

  /* 텍스트 블록(변수로 밀도 제어) */
  .h{font-size:var(--hsize); font-weight:740; letter-spacing:-.02em; margin:var(--mt-h) 0 var(--mb-h)}
  .sub{font-size:var(--subsize); color:var(--muted); line-height:var(--lh)}
  .cta{
    margin-top:var(--mt-cta); display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(59,91,219,.28); transition:transform .15s, box-shadow .15s;
  }
  .cta:hover{transform:translateY(-1px); box-shadow:0 7px 18px rgba(59,91,219,.34)}
  .hint{margin-top:var(--mt-hint); font-size:12px; color:var(--faint)}
  .hint kbd{
    border:1px solid var(--border); background:var(--surface); border-radius:5px;
    padding:1px 6px; font-family:inherit; font-size:11px; color:var(--muted);
  }

  /* ── 변형별 파라미터 ─────────────────────────── */
  /* L1 기준(원본): 로고 150, 셀 간격 16, 줄 높이 1.65 */
  #v-1 .center{--bs:150px; --big:88px; --small:46px; --g:16px; --r1:14px; --r2:10px;
    --hsize:19px; --subsize:13.5px; --lh:1.65; --mt-h:18px; --mb-h:7px; --mt-cta:18px; --mt-hint:13px}
  /* L2 타이트: 셀 간격 16→8, 줄 높이 1.5, 수직 간격 축소 */
  #v-2 .center{--bs:150px; --big:94px; --small:48px; --g:8px; --r1:14px; --r2:10px;
    --hsize:19px; --subsize:13.5px; --lh:1.5; --mt-h:14px; --mb-h:5px; --mt-cta:14px; --mt-hint:10px}
  /* L3 콤팩트: 로고 120으로 축소 + 타이트 간격 */
  #v-3 .center{--bs:120px; --big:76px; --small:38px; --g:6px; --r1:11px; --r2:8px;
    --hsize:18px; --subsize:13px; --lh:1.5; --mt-h:13px; --mb-h:5px; --mt-cta:13px; --mt-hint:9px}
  /* L4 미니멀: 로고 96, 카피 한 줄, 예시 칩 제거 */
  #v-4 .center{--bs:96px; --big:60px; --small:31px; --g:5px; --r1:9px; --r2:7px;
    --hsize:17.5px; --subsize:12.5px; --lh:1.5; --mt-h:12px; --mb-h:4px; --mt-cta:12px; --mt-hint:0}
  #v-4 .sub br{display:none}
  #v-4 .hint{display:none}
  /* L2-1 / L2-2: L2와 동일 파라미터, 하얀 바 높이만 축소 */
  #v-5 .center, #v-6 .center{--bs:150px; --big:94px; --small:48px; --g:8px; --r1:14px; --r2:10px;
    --hsize:19px; --subsize:13.5px; --lh:1.5; --mt-h:14px; --mb-h:5px; --mt-cta:14px; --mt-hint:10px}
  /* L2-1: 바 높이 15%→11% */
  #v-5 .chip{height:11%; border-radius:3.5px}
  #v-5 .chip:nth-child(1){top:15%}
  #v-5 .chip:nth-child(2){top:37%}
  #v-5 .chip:nth-child(3){top:59%}
  /* L2-2: 바 높이 8% — 얇은 라인 톤 */
  #v-6 .chip{height:8%; border-radius:3px}
  #v-6 .chip:nth-child(1){top:17%}
  #v-6 .chip:nth-child(2){top:39%}
  #v-6 .chip:nth-child(3){top:61%}
</style>
</head>
<body>
  <h1>A안(벤토 조립) — 간격·밀도 변형 4종</h1>
  <p class="note">모션·카피는 원본 그대로, 셀 간격·줄 높이·수직 리듬만 다릅니다. 탭 전환/다시 재생으로 반복 확인.</p>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="1">L1. 기준(원본)</button>
    <button role="tab" aria-selected="false" data-v="2">L2. 타이트</button>
    <button role="tab" aria-selected="false" data-v="3">L3. 콤팩트</button>
    <button role="tab" aria-selected="false" data-v="4">L4. 미니멀</button>
    <button role="tab" aria-selected="false" data-v="5">L2-1. 바 낮게</button>
    <button role="tab" aria-selected="false" data-v="6">L2-2. 바 얇게</button>
    <button class="replay" id="replay">↺ 다시 재생</button>
  </div>

  <template id="tpl">
    <div class="frame">
      <aside class="side">
        <div class="brand"><svg width="20" height="20" viewBox="0 0 48 48"><rect x="4" y="4" width="24" height="24" rx="6" fill="#3b5bdb"/><rect x="32" y="4" width="12" height="12" rx="4" fill="#1f2430"/><rect x="32" y="20" width="12" height="24" rx="4" fill="#c9d4ff"/><rect x="4" y="32" width="24" height="12" rx="4" fill="#c9d4ff"/></svg>tab<span class="lign">lign</span></div>
        <div class="label">SPACES</div>
        <div class="ghostrow"></div>
      </aside>
      <main class="board">
        <div class="center">
          <div class="bento" aria-hidden="true">
            <div class="cell c1"><i class="chip"></i><i class="chip"></i><i class="chip"></i></div>
            <div class="cell c2"></div>
            <div class="cell c3"></div>
            <div class="cell c4"></div>
          </div>
          <div class="h">첫 스페이스를 만들어보세요</div>
          <p class="sub">스페이스는 컬렉션과 링크를 담는 나만의 보드예요.<br/>만든 뒤에는 열린 탭을 끌어다 놓기만 하면 돼요.</p>
          <button class="cta">＋ 첫 스페이스 만들기</button>
          <p class="hint">예: <kbd>개인</kbd> <kbd>업무</kbd> <kbd>스터디</kbd></p>
        </div>
      </main>
    </div>
  </template>

  <section class="variant on" id="v-1"></section>
  <section class="variant" id="v-2"></section>
  <section class="variant" id="v-3"></section>
  <section class="variant" id="v-4"></section>
  <section class="variant" id="v-5"></section>
  <section class="variant" id="v-6"></section>

  <p class="caption" id="cap"></p>

<script>
  const captions = {
    1: "<b>L1 기준:</b> 처음 보신 원본 그대로. 로고 150px · 셀 간격 16px · 본문 줄 높이 1.65 · 넉넉한 수직 리듬.",
    2: "<b>L2 타이트:</b> 셀 간격 16→8px(실제 로고 비율에 가까움), 줄 높이 1.65→1.5, 로고-제목-CTA 사이 간격을 한 단계씩 축소. 로고가 더 단단해 보이고 전체 블록이 야무져요.",
    3: "<b>L3 콤팩트:</b> L2에서 로고를 150→120px로 줄인 버전. 텍스트가 주인공이 되고 화면 여백이 더 살아나요. 작은 창에서도 안정적.",
    4: "<b>L4 미니멀:</b> 로고 96px, 카피 한 문장, 예시 칩 제거. 가장 조용한 버전 — 새 탭을 자주 여는 사용자에게 부담이 없지만, 온보딩 안내로는 정보가 최소치예요.",
    5: "<b>L2-1 바 낮게:</b> L2에서 하얀 바 높이만 15%→11%. 바 사이 여백이 넉넉해져 큰 칸이 덜 빽빽하고, 카드라는 인상은 유지돼요.",
    6: "<b>L2-2 바 얇게:</b> 하얀 바를 8%까지 얇게 — 카드보다는 '목록 라인'에 가까운 섬세한 톤. 파란 칸의 존재감이 커지고 로고가 더 그래픽적으로 읽혀요.",
  };
  const cap = document.getElementById('cap');
  const tpl = document.getElementById('tpl');
  function mount(id){
    const sec = document.getElementById('v-' + id);
    sec.innerHTML = '';
    sec.appendChild(tpl.content.cloneNode(true));
  }
  function show(id){
    document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x.dataset.v === id)));
    document.querySelectorAll('.variant').forEach(v => v.classList.remove('on'));
    document.getElementById('v-' + id).classList.add('on');
    mount(id);
    cap.innerHTML = captions[id];
  }
  document.querySelectorAll('.tabs [role=tab]').forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
  document.getElementById('replay').addEventListener('click', () => {
    const cur = document.querySelector('.tabs [aria-selected="true"]').dataset.v;
    mount(cur);
  });
  show('1');
</script>
</body>
</html>
