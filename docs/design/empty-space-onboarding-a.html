<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tablign — A안 로고 모션 버전 비교</title>
<style>
  :root{
    --accent:#3b5bdb; --accent-weak:#edf0fe; --ink:#1f2430; --muted:#868e96;
    --faint:#adb5bd; --border:#eaecef; --bg:#fcfcfd; --surface:#fff;
    --surface2:#f1f3f5; --lavender:#c9d4ff;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#eef0f4; color:var(--ink); padding:28px 20px 60px;
  }
  h1{font-size:16px; font-weight:740; letter-spacing:-.02em; margin-bottom:4px}
  .note{font-size:12.5px; color:var(--muted); margin-bottom:18px}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .tabs button{
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    padding:7px 13px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .tabs button[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .replay{
    margin-left:auto; border:1px solid var(--border); background:var(--surface); color:var(--accent);
    padding:7px 13px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:700;
  }
  .variant{display:none}
  .variant.on{display:block}
  .caption{font-size:12.5px; color:var(--muted); margin:10px 2px 0; line-height:1.6}
  .caption b{color:var(--ink)}

  .frame{
    max-width:960px; background:var(--bg); border:1px solid var(--border);
    border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(20,30,60,.08);
    display:flex; min-height:480px;
  }
  .side{
    width:168px; border-right:1px solid var(--border); background:var(--surface);
    padding:14px 12px; flex:none; display:flex; flex-direction:column; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:7px; font-weight:740; letter-spacing:-.03em; font-size:14px}
  .brand .lign{color:var(--accent)}
  .side .label{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.06em; margin-top:8px}
  .side .ghostrow{height:26px; border-radius:7px; background:var(--surface2); opacity:.55}
  .board{flex:1; padding:26px 30px; display:flex; align-items:center; justify-content:center}

  .center{text-align:center; max-width:400px}
  .h{font-size:19px; font-weight:740; letter-spacing:-.02em; margin:18px 0 7px}
  .sub{font-size:13.5px; color:var(--muted); line-height:1.65}
  .cta{
    margin-top:18px; display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(59,91,219,.28); transition:transform .15s, box-shadow .15s;
  }
  .cta:hover{transform:translateY(-1px); box-shadow:0 7px 18px rgba(59,91,219,.34)}
  .hint{margin-top:13px; font-size:12px; color:var(--faint)}
  .hint kbd{
    border:1px solid var(--border); background:var(--surface); border-radius:5px;
    padding:1px 6px; font-family:inherit; font-size:11px; color:var(--muted);
  }

  /* 공통 벤토 기하: 150×150, 로고 비율 그대로 */
  .bento{width:150px; height:150px; margin:0 auto; position:relative}
  .cell{position:absolute; border-radius:14px}
  .c1{left:0; top:0; width:88px; height:88px; background:var(--accent)}
  .c2{right:0; top:0; width:46px; height:46px; background:var(--ink); border-radius:10px}
  .c3{right:0; top:56px; width:46px; height:94px; background:var(--lavender); border-radius:10px}
  .c4{left:0; bottom:0; width:88px; height:46px; background:var(--lavender); border-radius:10px}
  .chip{position:absolute; left:10px; height:14px; border-radius:4px; background:rgba(255,255,255,.92)}
  .chip:nth-child(1){top:12px; width:56px}
  .chip:nth-child(2){top:32px; width:44px}
  .chip:nth-child(3){top:52px; width:62px}

  /* ── V1. 흩어진 탭이 정렬 ─────────────────────── */
  /* 셀들이 어질러진 위치·기울기에서 제자리로 미끄러진다. 정돈의 서사. */
  #v-1 .cell{animation:settle 1.1s cubic-bezier(.22,.61,.36,1) forwards}
  #v-1 .c1{transform:translate(-26px,18px) rotate(-7deg); animation-delay:.05s}
  #v-1 .c2{transform:translate(20px,26px) rotate(10deg); animation-delay:.15s}
  #v-1 .c3{transform:translate(24px,-14px) rotate(-6deg); animation-delay:.25s}
  #v-1 .c4{transform:translate(-14px,-24px) rotate(5deg); animation-delay:.35s}
  @keyframes settle{to{transform:none}}
  #v-1 .chip{opacity:0; animation:chipIn .45s ease forwards}
  #v-1 .chip:nth-child(1){animation-delay:1.15s}
  #v-1 .chip:nth-child(2){animation-delay:1.3s}
  #v-1 .chip:nth-child(3){animation-delay:1.45s}
  @keyframes chipIn{from{opacity:0; transform:translateX(-8px)} to{opacity:1; transform:none}}

  /* ── V2. 소프트 페이드 ───────────────────────── */
  /* 로고 전체가 한 몸으로 은은하게 떠오른다. 가장 잔잔하고 점잖은 안. */
  #v-2 .bento{opacity:0; transform:translateY(8px) scale(.97); filter:blur(6px);
    animation:soft 1s cubic-bezier(.22,.61,.36,1) .1s forwards}
  @keyframes soft{to{opacity:1; transform:none; filter:blur(0)}}
  #v-2 .chip{opacity:0; animation:chipFade .6s ease forwards}
  #v-2 .chip:nth-child(1){animation-delay:1s}
  #v-2 .chip:nth-child(2){animation-delay:1.18s}
  #v-2 .chip:nth-child(3){animation-delay:1.36s}
  @keyframes chipFade{to{opacity:1}}

  /* ── V3. 살아있는 벤토 ───────────────────────── */
  /* 조립 연출 없이 완성형. 아주 미세하게 숨 쉬고, 칩이 천천히 순환한다. */
  #v-3 .bento{animation:breathe 5.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}}
  #v-3 .c2{animation:breathe 5.2s ease-in-out .5s infinite}
  #v-3 .c3{animation:breathe 5.2s ease-in-out .9s infinite}
  #v-3 .chip{animation:cycle 6s ease-in-out infinite}
  #v-3 .chip:nth-child(2){animation-delay:2s}
  #v-3 .chip:nth-child(3){animation-delay:4s}
  @keyframes cycle{0%,100%{opacity:.55} 30%{opacity:1} 60%{opacity:.55}}

  /* ── V4. 잉크 채우기 ─────────────────────────── */
  /* 셀이 윤곽에서 시작해 아래에서 위로 차오른다. "채워 넣는" 제품 행위 은유. */
  #v-4 .cell{background:transparent !important; overflow:hidden}
  #v-4 .cell::before{content:""; position:absolute; inset:0; border-radius:inherit;
    border:1.5px solid var(--border); opacity:1; animation:lineFade .4s ease 1.5s forwards}
  #v-4 .cell::after{content:""; position:absolute; left:0; right:0; bottom:0; height:0;
    border-radius:inherit; animation:fill .8s cubic-bezier(.22,.61,.36,1) forwards}
  #v-4 .c1::after{background:var(--accent); animation-delay:.15s}
  #v-4 .c2::after{background:var(--ink); animation-delay:.45s}
  #v-4 .c3::after{background:var(--lavender); animation-delay:.65s}
  #v-4 .c4::after{background:var(--lavender); animation-delay:.85s}
  @keyframes fill{to{height:100%}}
  @keyframes lineFade{to{opacity:0}}
  #v-4 .chip{opacity:0; z-index:1; animation:chipIn .45s ease forwards}
  #v-4 .chip:nth-child(1){animation-delay:1.5s}
  #v-4 .chip:nth-child(2){animation-delay:1.65s}
  #v-4 .chip:nth-child(3){animation-delay:1.8s}

  @media (prefers-reduced-motion: reduce){
    .bento,.cell,.chip,.cell::before,.cell::after{animation:none !important; opacity:1 !important; transform:none !important; filter:none !important}
    #v-4 .cell::after{height:100%}
    #v-4 .cell::before{opacity:0}
  }
</style>
</head>
<body>
  <h1>A안 로고 모션 — 4가지 버전</h1>
  <p class="note">카피·CTA는 동일, 로고의 등장 방식만 다릅니다. 탭 전환 시 애니메이션이 다시 재생돼요.</p>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="1">V1. 흩어진 탭이 정렬 (추천)</button>
    <button role="tab" aria-selected="false" data-v="2">V2. 소프트 페이드</button>
    <button role="tab" aria-selected="false" data-v="3">V3. 살아있는 벤토</button>
    <button role="tab" aria-selected="false" data-v="4">V4. 잉크 채우기</button>
    <button class="replay" id="replay">↺ 다시 재생</button>
  </div>

  <template id="tpl">
    <div class="frame">
      <aside class="side">
        <div class="brand"><svg width="20" height="20" viewBox="0 0 48 48"><rect x="4" y="4" width="24" height="24" rx="6" fill="#3b5bdb"/><rect x="32" y="4" width="12" height="12" rx="4" fill="#1f2430"/><rect x="32" y="20" width="12" height="24" rx="4" fill="#c9d4ff"/><rect x="4" y="32" width="24" height="12" rx="4" fill="#c9d4ff"/></svg>tab<span class="lign">lign</span></div>
        <div class="label">SPACES</div>
        <div class="ghostrow"></div>
      </aside>
      <main class="board">
        <div class="center">
          <div class="bento" aria-hidden="true">
            <div class="cell c1"><i class="chip"></i><i class="chip"></i><i class="chip"></i></div>
            <div class="cell c2"></div>
            <div class="cell c3"></div>
            <div class="cell c4"></div>
          </div>
          <div class="h">첫 스페이스를 만들어보세요</div>
          <p class="sub">스페이스는 컬렉션과 링크를 담는 나만의 보드예요.<br/>만든 뒤에는 열린 탭을 끌어다 놓기만 하면 돼요.</p>
          <button class="cta">＋ 첫 스페이스 만들기</button>
          <p class="hint">예: <kbd>개인</kbd> <kbd>업무</kbd> <kbd>스터디</kbd></p>
        </div>
      </main>
    </div>
  </template>

  <section class="variant on" id="v-1"></section>
  <section class="variant" id="v-2"></section>
  <section class="variant" id="v-3"></section>
  <section class="variant" id="v-4"></section>

  <p class="caption" id="cap"></p>

<script>
  const captions = {
    1: "<b>V1 흩어진 탭이 정렬:</b> 셀들이 어질러진 위치·기울기에서 제자리로 부드럽게 미끄러져요(바운스 없음, 1.1s). \"흩어진 탭이 정돈된다\"는 제품 서사가 모션 자체에 담겨 가장 자연스럽고 의미도 있어요.",
    2: "<b>V2 소프트 페이드:</b> 로고가 한 몸으로 블러에서 또렷하게 떠올라요. 연출이 거의 느껴지지 않는 가장 점잖은 안 — 매일 보는 새 탭이라는 점에선 이 절제가 강점이에요.",
    3: "<b>V3 살아있는 벤토:</b> 등장 연출 없이 완성형이 아주 미세하게 숨 쉬고, 카드가 천천히 순환해요. 유일하게 '상시 모션'이라 정적인 빈 화면이 살아있어 보이지만, 과하면 시선을 뺏을 수 있어 진폭을 최소로 잡았어요.",
    4: "<b>V4 잉크 채우기:</b> 옅은 윤곽선에서 시작해 각 칸이 아래에서 위로 차올라요. \"칸에 채워 넣는다\"는 행위 은유가 직관적이고 손맛이 있어요.",
  };
  const cap = document.getElementById('cap');
  const tpl = document.getElementById('tpl');
  function mount(id){
    const sec = document.getElementById('v-' + id);
    sec.innerHTML = '';
    sec.appendChild(tpl.content.cloneNode(true));
  }
  function show(id){
    document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x.dataset.v === id)));
    document.querySelectorAll('.variant').forEach(v => v.classList.remove('on'));
    document.getElementById('v-' + id).classList.add('on');
    mount(id); // 다시 마운트해 애니메이션 재생
    cap.innerHTML = captions[id];
  }
  document.querySelectorAll('.tabs [role=tab]').forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
  document.getElementById('replay').addEventListener('click', () => {
    const cur = document.querySelector('.tabs [aria-selected="true"]').dataset.v;
    mount(cur);
  });
  show('1');
</script>
</body>
</html>
